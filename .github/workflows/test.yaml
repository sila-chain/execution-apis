name: Test

on: [push, pull_request, workflow_dispatch]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      # Specification
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ^1.26
          cache-dependency-path: tools/go.sum
        id: go

      - name: Refresh Sila generator authority for closure evidence
        working-directory: ./tools
        run: |
          go get github.com/sila-chain/go-sila@2c2deea9ac4a2f41ce099734f3015338f490651f
          go mod tidy

      - name: Build the spec
        run: make build

      # speccheck
      - name: Run speccheck
        run: make test

      - name: Run openrpc-linter
        run: make lint

      # check test filling
      - name: Fill tests
        working-directory: ./tools
        run: make fill

      - name: Emit Sila-native generated closure evidence
        shell: bash
        run: |
          set -eu
          sha256sum tools/go.mod tools/go.sum tests/chain.rlp tools/chain/chain.rlp
          for f in tools/go.mod tools/go.sum tests/chain.rlp; do
            key=$(echo "$f" | tr '/.' '__')
            echo "BEGIN_BASE64_${key}"
            base64 -w0 "$f"
            echo
            echo "END_BASE64_${key}"
          done

      - name: Fail if any files are untracked or have changes
        # sila outputs non-deterministic responses for two tests-
        # specifically storageKeys arrays in the responses.
        # Filter them from the diff check until fixed.
        run: |
          STATUS=$(git status --porcelain . \
            ':!tests/sil_createAccessList/create-al-contract.io' \
            ':!tests/sil_createAccessList/create-al-contract-sip1559.io')
          if [ -n "$STATUS" ]; then
            echo "Unexpected changes after test filling:"
            echo "$STATUS"
            git diff --stat
            exit 1
          fi

  lint-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ^1.24
          cache-dependency-path: tools/go.sum
        id: go
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Lint tools
        working-directory: ./tools
        run: make lint
      - name: Test tools
        working-directory: ./tools
        run: make test
