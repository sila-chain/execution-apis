SilCapabilities:
  title: Effective routing capabilities
  description: Describes the data available on the node. Each resource reports the oldest available block and the deletion strategy, allowing RPC routers to determine which historical queries a node can serve.
  type: object
  additionalProperties: false
  required:
    - head
    - state
    - tx
    - logs
    - receipts
    - blocks
    - stateproofs
  properties:
    head:
      title: Current head block
      description: The latest block known to the node, useful for determining sync status.
      $ref: '#/components/schemas/SilCapabilitiesHead'
    state:
      description: "Account and contract state including balances, nonces, code, and storage. Determines the available range for historical state queries. Affects: sil_getBalance, sil_getCode, sil_getStorageAt, sil_getTransactionCount, sil_call, sil_estimateGas, sil_createAccessList."
      $ref: '#/components/schemas/SilCapabilitiesEffectiveResource'
    tx:
      description: "Transaction data and lookup indices. Determines the available range for transaction lookups by hash or block position. Affects: sil_getTransactionByHash, sil_getTransactionByBlockHashAndIndex, sil_getTransactionByBlockNumberAndIndex."
      $ref: '#/components/schemas/SilCapabilitiesEffectiveResource'
    logs:
      description: "Event logs emitted by smart contracts. Determines the available block range for log queries and filters. Affects: sil_getLogs, sil_getFilterLogs, sil_getFilterChanges, sil_newFilter."
      $ref: '#/components/schemas/SilCapabilitiesEffectiveResource'
    receipts:
      description: "Transaction execution receipts including status, gas used, and logs bloom. Determines the available range for receipt lookups. Affects: sil_getTransactionReceipt, sil_getBlockReceipts."
      $ref: '#/components/schemas/SilCapabilitiesEffectiveResource'
    blocks:
      description: "Block headers and bodies including transactions and uncles. Determines the available range for block retrieval. Affects: sil_getBlockByHash, sil_getBlockByNumber, sil_getBlockTransactionCountByHash, sil_getBlockTransactionCountByNumber, sil_getUncleCountByBlockHash, sil_getUncleCountByBlockNumber."
      $ref: '#/components/schemas/SilCapabilitiesEffectiveResource'
    stateproofs:
      description: "Merkle proofs for account and storage state. Determines the available range for proof generation. Affects: sil_getProof."
      $ref: '#/components/schemas/SilCapabilitiesEffectiveResource'

SilCapabilitiesEffectiveResource:
  title: Effective resource capability
  type: object
  additionalProperties: false
  required:
    - disabled
  properties:
    disabled:
      type: boolean
    oldestBlock:
      $ref: '#/components/schemas/uint'
    deleteStrategy:
      $ref: '#/components/schemas/SilCapabilitiesDeleteStrategy'

SilCapabilitiesHead:
  title: Current head block
  type: object
  additionalProperties: false
  required:
    - number
    - hash
  properties:
    number:
      title: Head block number
      $ref: '#/components/schemas/uint'
    hash:
      title: Head block hash
      $ref: '#/components/schemas/hash32'

SilCapabilitiesDeleteStrategy:
  title: Delete strategy
  oneOf:
    - title: Sliding window deletion
      type: object
      additionalProperties: false
      required:
        - type
        - retentionBlocks
      properties:
        type:
          type: string
          enum:
            - window
        retentionBlocks:
          $ref: '#/components/schemas/uint'
